description: 鶴と城下町、桜の町、鶴岡市のおいしい店を、地図のピンと一緒にたどるグルメ案内です。庄内浜の海の幸、庄内鴨、孟宗汁など、食の都・庄内の味が見えてきます。
subtitle: 鶴岡の味を地図で集めた読みもの
hero_note: 地図と小さな旅
about: 山形県鶴岡市内の飲食店・食のスポットを訪れた人のSNS投稿をもとに、お店と料理を地図と一緒に紹介するグルメ案内です。カバー画像はAIが作成した水彩調イラストで、実際の料理の写真は各記事に埋め込んだ元投稿で確認できます。
